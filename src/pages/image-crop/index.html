<!DOCTYPE html>
<html lang="en">

<head>
    <title>emcJS sandbox</title>
    <meta charset="UTF-8">
    <meta name="description" content="Test for emcJS components">
    <meta name="robots" content="none">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <script type="importmap">
    {
        "imports": {

            "@emcjs/core/": "/_libs/emcjs/core/",
            "@emcjs/fe/": "/_libs/emcjs/fe/"
        }
    }
    </script>
    <!-- ${theme} -->
    <style>
        #image-cropper {
            resize: both;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px;
        }

        #image-preview {
            margin: 15px;
            border: 1px black solid;
        }

        #crop-button {
            margin: 15px;
        }
    </style>
    <script type="module" src="./index.js"></script>
</head>

<body style="display: flex; flex-direction: column;">
    <emc-page id="page" style="padding: 8px; min-width: min-content;">
        <div class="row">
            <emc-image-cropper id="image-cropper" src="/pages/image-crop/old_red.png" width="180" height="270" maskradius="22.5px"></emc-image-cropper>
            <button id="crop-button">Crop!</button>
            <img id="image-preview">
        </div>
        <div class="row">
            <emc-input-file id="image-upload" accept="image/*"></emc-input-file>
        </div>
    </emc-page>
</body>

</html>
